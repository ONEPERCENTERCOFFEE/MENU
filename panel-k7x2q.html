<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Menü Yönetimi</title>
<style>
:root{--bg:#000;--sf:#141414;--ln:#3a3a3a;--tx:#fff;--mu:#a8a8a8;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0 auto;max-width:760px;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:16px 14px 110px}
h1{font-size:22px;margin:8px 0 4px}p,.mu{color:var(--mu)}
input,select,button{font:inherit;color:var(--tx);background:#000;border:1px solid var(--ln);border-radius:8px;padding:9px 10px;min-width:0}
button{cursor:pointer;background:var(--sf)}button.pri{background:#fff;color:#000;font-weight:700;border-color:#fff}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--mu)}
.w{width:100%}.card{border:1px solid var(--ln);border-radius:12px;padding:12px;margin:16px 0;background:var(--sf)}
.bar{display:flex;gap:6px;margin-bottom:8px}.ttl{flex:1;font-weight:700;font-size:17px}
.it{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0;border-top:1px solid var(--ln)}
.g{flex:1 1 150px}.pr{width:84px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
details{margin:12px 0}summary{cursor:pointer;color:var(--mu)}ol{padding-left:20px}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<h1>Menü Yönetimi</h1>
<div id="login">
<p>Menüyü düzenlemek için yönetici kullanıcı adı ve şifrenizle giriş yapın.</p>
<label>Kullanıcı adı</label><input class="w" id="un" autocapitalize="none" autocomplete="username">
<label>Şifre</label><input class="w" id="pw" type="password" autocomplete="current-password">
<div id="ts" style="margin:12px 0"></div>
<p><button class="pri" id="go">Giriş yap</button></p>
</div>
<div id="ed" hidden>
<p class="mu">Değişiklikler yalnızca "Kaydet"e basınca menüye yansır. <button id="hist">Sürüm geçmişi</button> <button id="out">Çıkış</button></p>
<div id="hs" hidden class="card"></div>
<div id="list"></div>
</div>
<div id="bar"><span id="st" class="mu"></span><span style="display:flex;gap:6px;align-items:center"><input id="nt" placeholder="Not (isteğe bağlı)" style="max-width:190px"><button class="pri" id="sv" hidden>Kaydet</button></span></div>
<script>
var $=function(i){return document.getElementById(i)},D=null,sha=null;
function e(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function st(m,c){var s=$("st");s.textContent=m;s.style.color=c||""}
var sb=supabase.createClient("https://ojfmpnqyrdfybbmchbvq.supabase.co","sb_publishable_oS6qBLKqbAPCBCzGVe5efw_AFqvCPoG"),curVer=null;
var TK="0x4AAAAAAFli3uwc6xrSxT7j",TT="";
function tsr(id){var el=$(id);if(!el)return;if(!window.turnstile){setTimeout(function(){tsr(id)},300);return}TT="";turnstile.render(el,{sitekey:TK,theme:"dark",callback:function(t){TT=t},"expired-callback":function(){TT=""},"error-callback":function(){TT=""}})}
async function after(){var u=(await sb.auth.getUser()).data.user;if(!u)return false;
var p=await sb.from("profiles").select("name,role,active").eq("id",u.id).maybeSingle();
if(!p.data||p.data.role!="yonetici"||!p.data.active){await sb.auth.signOut();st("Bu sayfa yalnızca yönetici içindir","#ff7b7b");return false}
st("Yükleniyor...");var r=await sb.from("menu_data").select("menu,version_id").eq("id",1).maybeSingle();if(r.error)throw r.error;
if(r.data){D=r.data.menu;curVer=r.data.version_id}
else{st("Eski menü içe aktarılıyor...");var f=await fetch("menu.json?t="+Date.now());D=await f.json();var s=await sb.rpc("save_menu",{p_menu:D,p_note:"Eski menu.json içe aktarıldı"});if(s.error)throw s.error;curVer=s.data}
norm();$("login").hidden=true;$("ed").hidden=false;$("sv").hidden=false;draw();st("Yüklendi","#7ddc8a");return true}
async function login(){var u=$("un").value.trim().toLowerCase().replace(/\s+/g,""),pw=$("pw").value;if(!u||!pw){st("Kullanıcı adı ve şifre girin","#ff7b7b");return}
if(!TT){st("Lütfen doğrulamayı tamamlayın","#ff7b7b");return}
var r=await sb.auth.signInWithPassword({email:u+"@op.example.com",password:pw,options:{captchaToken:TT}});
if(r.error){st(/captcha/i.test(r.error.message)?"Doğrulama başarısız, sayfayı yenileyip tekrar deneyin":"Kullanıcı adı ya da şifre yanlış","#ff7b7b");return}
try{await after()}catch(x){st("Hata: "+(x.message||x),"#ff7b7b")}}
async function save(){st("Kaydediliyor...");var r=await sb.rpc("save_menu",{p_menu:D,p_note:$("nt").value});
if(r.error){st("Kaydedilemedi: "+r.error.message,"#ff7b7b");return}curVer=r.data;$("nt").value="";st("Kaydedildi. Menüde hemen görünür.","#7ddc8a");if(!$("hs").hidden)hist()}
async function hist(){var hs=$("hs");hs.hidden=false;hs.innerHTML='<p class="mu">Yükleniyor...</p>';
var r=await sb.from("menu_versions").select("id,note,created_by_name,created_at").order("id",{ascending:false}).limit(30);
if(r.error){hs.innerHTML='<p style="color:#ff7b7b">'+e(r.error.message)+'</p>';return}
hs.innerHTML='<div class="bar"><b style="flex:1">Sürüm geçmişi</b><button id="hx">Kapat</button></div><p class="mu" style="margin:0 0 6px">Bir sürüme dönünce menü o hâline gelir. Güncel hâl kaybolmaz, geçmişte durur ve yeniden dönülebilir.</p>'+(r.data.map(function(v){return'<div class="it" style="align-items:center"><div style="flex:1;min-width:160px"><b>'+new Date(v.created_at).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})+'</b>'+(v.id==curVer?' <span style="color:#7ddc8a">· şu an yayında</span>':'')+'<div class="mu" style="font-size:12.5px">'+e(v.note||"")+(v.created_by_name?" · "+e(v.created_by_name):"")+'</div></div>'+(v.id==curVer?'':'<button data-rv="'+v.id+'">Bu sürüme dön</button>')+'</div>'}).join("")||'<p class="mu">Henüz sürüm yok.</p>')}
async function restore(id){if(!confirm("Menü bu sürüme geri alınsın mı? Kaydedilmemiş değişiklikleriniz kaybolur."))return;st("Geri alınıyor...");
var r=await sb.rpc("restore_menu",{p_version:id});if(r.error){st("Geri alınamadı: "+r.error.message,"#ff7b7b");return}
var m=await sb.from("menu_data").select("menu,version_id").eq("id",1).maybeSingle();D=m.data.menu;curVer=m.data.version_id;norm();draw();st("Geri alındı. Menüde hemen görünür.","#7ddc8a");hist()}
function mark(){st("Kaydedilmemiş değişiklikler var","#ffd479")}
function A(s,i,f){return ' data-s="'+s+'"'+(i!=null?' data-i="'+i+'"':"")+(f?' data-f="'+f+'"':"")}
var TG=[["","Simge yok"],["c","❄ Soğuk"],["h","☕ Sıcak"],["b","❄ ☕ İkisi"]];
var SZ=["100 g","250 g","1 kg"];
var SEED=[
["Yirgacheffe Natural","Etiyopya · Yirgacheffe","Natural","1900-2100 m",2,"yaban mersini, yasemin, bal","Güneşte kurutulan, meyvemsi ve çiçeksi bir klasik.",[["V60",140],["Chemex",150],["Aeropress",130]],[220,520,1900]],
["Huila Washed","Kolombiya · Huila","Yıkanmış","1700 m",3,"karamel, kırmızı elma, kakao","Dengeli, tatlı ve her gün içilebilir.",[["V60",130],["French press",120],["Aeropress",120]],[200,460,1700]],
["Nyeri AA","Kenya · Nyeri","Yıkanmış","1800 m",2,"frenk üzümü, mandalina, siyah çay","Canlı asiditesiyle parlak ve aromatik.",[["V60",160],["Chemex",170]],[260,600,2200]],
["Cerrado Natural","Brezilya · Cerrado","Natural","1100 m",4,"fındık, çikolata, kuru kayısı","Yumuşak gövdeli, tatlı ve kremsi.",[["V60",120],["French press",110],["Aeropress",110]],[170,400,1450]],
["Antigua","Guatemala · Antigua","Yıkanmış","1600 m",3,"bitter çikolata, portakal kabuğu, baharat","Volkanik toprağın verdiği zengin ve derin bir fincan.",[["Chemex",140],["V60",130]],[190,440,1600]],
["Geisha Reserva","Panama · Boquete","Yıkanmış","1700 m",1,"bergamot, şeftali, çiçeksi","Sınırlı sayıda, özel gün için.",[["V60",280]],[750,0,0]]];
function newCard(){return{name:"Yeni kahve",origin:"",process:"",altitude:"",roast:3,notes:[],story:"",methods:[{name:"V60",price:0}],beans:SZ.map(function(z){return{size:z,price:0}})}}
function norm(){D.sections.forEach(function(s){if(s.type!="brew")return;s.cards=s.cards||[];s.cards.forEach(function(c){c.notes=c.notes||[];c.methods=c.methods||[];var o=c.beans||[];c.beans=SZ.map(function(z){var f=o.filter(function(b){return b.size==z})[0];return{size:z,price:f?+f.price:0}})})})}
function seedBrew(){var k=D.sections.findIndex(function(x){return/espresso/i.test(x.title)}),at=k<0?0:k+1;
D.sections.splice(at,0,{title:"OP Brew Bar",type:"brew",note:"Nitelikli kahvelerimizi, seçtiğiniz demleme yöntemiyle hazırlıyoruz.",items:[],cards:SEED.map(function(r){return{name:r[0],origin:r[1],process:r[2],altitude:r[3],roast:r[4],notes:r[5].split(", "),story:r[6],methods:r[7].map(function(m){return{name:m[0],price:m[1]}}),beans:SZ.map(function(z,i){return{size:z,price:r[8][i]}})}})});
if(k>=0)D.sections[k].linkTo="OP Brew Bar"}
var RL=["1 · çok açık","2 · açık","3 · orta","4 · orta-koyu","5 · koyu"];
function drawBrew(s,i){var h='<div class="card"><div class="bar"><input class="ttl"'+A(i,null,"title")+' value="'+e(s.title)+'" placeholder="Bölüm adı"><button data-a="su"'+A(i)+'>↑</button><button data-a="sd"'+A(i)+'>↓</button><button data-a="sx"'+A(i)+'>Sil</button></div><input class="w"'+A(i,null,"note")+' value="'+e(s.note)+'" placeholder="Bölüm notu (isteğe bağlı)">'+SV(i,s);
(s.cards||[]).forEach(function(c,j){var P=' data-s="'+i+'" data-c="'+j+'"';
h+='<div class="it" style="display:block"><div class="bar"><input class="ttl"'+P+' data-f="name" value="'+e(c.name)+'" placeholder="Kahve adı"><button data-a="cu"'+P+'>↑</button><button data-a="cd"'+P+'>↓</button><button class="d" data-a="cx"'+P+'>Sil</button></div>'+CV(P,c);
h+='<input class="w"'+P+' data-f="origin" value="'+e(c.origin)+'" placeholder="Menşe (örn. Etiyopya · Yirgacheffe)" style="margin-bottom:6px"><div style="display:flex;gap:6px;margin-bottom:6px"><input'+P+' data-f="process" value="'+e(c.process)+'" placeholder="İşlem"><input'+P+' data-f="altitude" value="'+e(c.altitude)+'" placeholder="Rakım"><select'+P+' data-f="roast">'+RL.map(function(t,k){return'<option value="'+(k+1)+'"'+(c.roast==k+1?' selected':'')+'>'+t+'</option>'}).join('')+'</select></div>';
h+='<input class="w"'+P+' data-f="notes" value="'+e((c.notes||[]).join(", "))+'" placeholder="Tadım notları (virgülle ayırın)" style="margin-bottom:6px"><input class="w"'+P+' data-f="story" value="'+e(c.story)+'" placeholder="Kısa hikâye cümlesi (isteğe bağlı)" style="margin-bottom:8px">';
h+='<div class="mu sm">Demleme yöntemleri</div>';
c.methods.forEach(function(m,k){var M=P+' data-m="'+k+'"';h+='<div style="display:flex;gap:6px;margin:4px 0"><input'+M+' data-f="mname" value="'+e(m.name)+'" placeholder="Yöntem"><input class="pr"'+M+' data-f="mprice" type="number" inputmode="numeric" value="'+e(m.price)+'"><button class="d" data-a="mx"'+M+'>Sil</button></div>'});
h+='<button data-a="ma"'+P+' style="margin:4px 0 10px">+ Yöntem ekle</button><div class="mu sm">Çekirdek paketi (fiyatı 0 olan boyut gösterilmez)</div><div style="display:flex;gap:6px;margin-top:4px">';
c.beans.forEach(function(b,k){h+='<label style="flex:1;margin:0"><span class="mu sm">'+b.size+'</span><input type="number" inputmode="numeric"'+P+' data-b="'+k+'" data-f="bprice" value="'+e(b.price)+'"></label>'});
h+='</div></div>'});
return h+'<button data-a="ca" data-s="'+i+'">+ Kahve ekle</button></div>'}
function SV(i,s){return'<label class="cb" style="margin:10px 0"><input type="checkbox"'+A(i,null,"v")+(s.v===false?'':' checked')+'> Bölüm menüde görünsün</label>'}
function CV(P,c){return'<label class="cb" style="margin:0 0 8px"><input type="checkbox"'+P+' data-f="v"'+(c.v===false?'':' checked')+'> Menüde göster</label>'}
function draw(){var h="";
D.sections.forEach(function(s,i){if(s.type=="brew"){h+=drawBrew(s,i);return}
h+='<div class="card"><div class="bar"><input class="ttl"'+A(i,null,"title")+' value="'+e(s.title)+'" placeholder="Bölüm adı"><button data-a="su"'+A(i)+'>↑</button><button data-a="sd"'+A(i)+'>↓</button><button data-a="sx"'+A(i)+'>Sil</button></div>';
h+='<input class="w"'+A(i,null,"note")+' value="'+e(s.note)+'" placeholder="Bölüm notu (isteğe bağlı)">'+SV(i,s);
s.items.forEach(function(m,j){
h+='<div class="it"'+(m.v===false?' style="opacity:.55"':"")+'><input class="g"'+A(i,j,"n")+' value="'+e(m.n)+'" placeholder="Ürün adı"><input class="pr" type="number" inputmode="numeric"'+A(i,j,"p")+' value="'+e(m.p)+'"><input class="w"'+A(i,j,"d")+' value="'+e(m.d)+'" placeholder="Açıklama (isteğe bağlı)"><label class="cb" style="flex:1 1 100%;margin:2px 0;font-size:14px"><input type="checkbox"'+A(i,j,"v")+(m.v===false?'':' checked')+'> Menüde göster</label><select'+A(i,j,"t")+'>';
TG.forEach(function(t){h+='<option value="'+t[0]+'"'+(m.t==t[0]?" selected":"")+">"+t[1]+"</option>"});
h+='</select><button data-a="iu"'+A(i,j)+'>↑</button><button data-a="id"'+A(i,j)+'>↓</button><button data-a="ix"'+A(i,j)+'>Sil</button></div>'});
h+='<button data-a="ia"'+A(i)+'>+ Ürün ekle</button></div>'});
h+='<button data-a="sa">+ Bölüm ekle</button>'+(D.sections.some(function(x){return x.type=="brew"})?'':' <button data-a="bs">+ Demleme Barı ekle (örnek kahvelerle)</button>');$("list").innerHTML=h}
$("list").addEventListener("input",function(ev){var t=ev.target,f=t.dataset.f;if(!f)return;
if(t.dataset.c!=null){var cd=D.sections[t.dataset.s].cards[t.dataset.c],v=t.value;
if(f=="mname")cd.methods[t.dataset.m].name=v;else if(f=="mprice")cd.methods[t.dataset.m].price=v===""?0:Number(v);
else if(f=="bprice")cd.beans[t.dataset.b].price=v===""?0:Number(v);
else if(f=="notes")cd.notes=v.split(",").map(function(x){return x.trim()}).filter(Boolean);
else if(f=="roast")cd.roast=+v;else if(f=="v")cd.v=t.checked;else cd[f]=v;mark();return}
var o=t.dataset.i!=null?D.sections[t.dataset.s].items[t.dataset.i]:D.sections[t.dataset.s];o[f]=f=="v"?t.checked:f=="p"?(t.value===""?0:Number(t.value)):t.value;mark()});
$("list").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;var a=b.dataset.a,s=+b.dataset.s,i=+b.dataset.i,S=D.sections;
function mv(r,k,d){var n=k+d;if(n<0||n>=r.length)return;var x=r[k];r[k]=r[n];r[n]=x}
var c=+b.dataset.c,m=+b.dataset.m;
if(a=="cu")mv(S[s].cards,c,-1);else if(a=="cd")mv(S[s].cards,c,1);
else if(a=="cx"){if(!confirm("Bu kahve silinsin mi?"))return;S[s].cards.splice(c,1)}
else if(a=="ca")S[s].cards.push(newCard());
else if(a=="ma")S[s].cards[c].methods.push({name:"",price:0});
else if(a=="mx")S[s].cards[c].methods.splice(m,1);
else if(a=="bs")seedBrew();
else if(a=="su")mv(S,s,-1);else if(a=="sd")mv(S,s,1);
else if(a=="sx"){if(!confirm("Bölüm ve içindeki tüm ürünler silinsin mi?"))return;S.splice(s,1)}
else if(a=="sa")S.push({title:"Yeni bölüm",note:"",items:[]});
else if(a=="ia")S[s].items.push({n:"",d:"",p:0,t:""});
else if(a=="iu")mv(S[s].items,i,-1);else if(a=="id")mv(S[s].items,i,1);
else if(a=="ix"){if(!confirm("Bu ürün silinsin mi?"))return;S[s].items.splice(i,1)}
mark();draw()});
$("go").onclick=login;$("sv").onclick=save;$("hist").onclick=hist;
$("out").onclick=async function(){await sb.auth.signOut();location.reload()};
document.addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;if(b.id=="hx")$("hs").hidden=true;else if(b.dataset.rv)restore(+b.dataset.rv)});
tsr("ts");
(async function(){try{var s=await sb.auth.getSession();if(s.data.session)await after()}catch(x){st("Hata: "+(x.message||x),"#ff7b7b")}})();
</script>
</body>
</html>
